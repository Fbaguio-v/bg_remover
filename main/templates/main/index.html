{% extends 'main/base.html' %}
{% block title %} {% endblock %}
{% block content %}
    <div class="inner-container">
        <div>
            <h1>Background Remover?</h1>
            <form action="{% url 'main:remove' %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <label for="image"></label>
                <input type="file" name="image" id="image" alt="image" accept="image/*" required>
                <span id="text-output">No files selected</span>
                <button type="submit">Upload</button>
            </form>

            {% if output_image %}
                <img src="{{ output_image }}" alt="" style="height: 200px; width: 200px;">
            {% endif %}
        </div>
    </div>
{% endblock %}
